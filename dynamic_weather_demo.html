<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>动态天气示例 - 旭岳滑雪场</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
            background: #f5f7fa;
            color: #333;
            padding: 20px;
        }

        .weather-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .section-title {
            font-size: 1.1em;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #888;
        }

        .current-weather {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-temp {
            font-size: 3em;
            font-weight: 700;
        }

        .snow-depth {
            font-size: 2.5em;
            font-weight: 700;
        }

        .forecast-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .forecast-day {
            flex-shrink: 0;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px 10px;
            text-align: center;
            min-width: 70px;
        }

        .forecast-date {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 8px;
        }

        .forecast-temp {
            font-size: 1em;
            font-weight: 600;
            color: #e53935;
            margin-bottom: 5px;
        }

        .forecast-snow {
            font-size: 0.85em;
            color: #1976d2;
        }

        .update-time {
            text-align: center;
            font-size: 0.75em;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="weather-section">
        <div class="section-title">🌤️ 实时天气预报</div>

        <div id="weather-content" class="loading">
            正在加载实时数据...
        </div>

        <div class="update-time" id="update-time"></div>
    </div>

    <script>
        // 雪场ID
        const SPOT_ID = '31215'; // 旭岳

        // 获取天气数据
        async function fetchWeatherData() {
            try {
                // 1. 获取积雪数据
                const obsResponse = await fetch(`https://site.weathernews.jp/site/ski/json/spotobs/${SPOT_ID}.json`);
                const obsData = await obsResponse.json();

                // 2. 获取天气预报
                const fcstResponse = await fetch(`https://site.weathernews.jp/site/ski/json/fcst_v1/fcst${SPOT_ID}.json`);
                const fcstData = await fcstResponse.json();

                return {
                    snowDepth: obsData.snow_depth,
                    forecasts: fcstData.srf.slice(0, 7)
                };
            } catch (error) {
                console.error('获取天气数据失败:', error);
                return null;
            }
        }

        // 渲染天气界面
        function renderWeather(data) {
            if (!data) {
                document.getElementById('weather-content').innerHTML = '❌ 数据加载失败';
                return;
            }

            const dayLabels = ['今天', '明天', '后天', '第4天', '第5天', '第6天', '第7天'];

            const html = `
                <div class="current-weather">
                    <div>
                        <div class="current-temp">${data.forecasts[0].AIRTMP}°C</div>
                        <div style="opacity: 0.9; margin-top: 5px;">❄️ 降雪 ${data.forecasts[0].SNOW}cm</div>
                    </div>
                    <div style="text-align: right;">
                        <div class="snow-depth">${data.snowDepth}cm</div>
                        <div style="opacity: 0.9; margin-top: 5px;">当前积雪</div>
                    </div>
                </div>

                <div class="forecast-grid">
                    ${data.forecasts.map((day, i) => `
                        <div class="forecast-day">
                            <div class="forecast-date">${dayLabels[i]}</div>
                            <div class="forecast-temp">${day.AIRTMP}°C</div>
                            <div class="forecast-snow">❄️ ${day.SNOW}cm</div>
                        </div>
                    `).join('')}
                </div>
            `;

            document.getElementById('weather-content').innerHTML = html;

            // 显示更新时间
            const now = new Date();
            document.getElementById('update-time').textContent =
                `数据更新于: ${now.toLocaleString('zh-CN')} | 来源: weathernews.jp`;
        }

        // 页面加载时获取数据
        window.addEventListener('DOMContentLoaded', async () => {
            const data = await fetchWeatherData();
            renderWeather(data);
        });

        // 每10分钟自动刷新一次
        setInterval(async () => {
            const data = await fetchWeatherData();
            renderWeather(data);
        }, 10 * 60 * 1000);
    </script>
</body>
</html>
