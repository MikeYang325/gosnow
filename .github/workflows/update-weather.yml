name: Update Weather Data

on:
  schedule:
    # 每小时运行一次（UTC时间）
    - cron: '0 * * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Fetch weather data from weathernews.jp
      run: |
        python3 update_all_weather.py

    - name: Commit and push if changed
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html resorts/*-new.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update weather data from weathernews.jp [$(date +'%Y-%m-%d %H:%M UTC')]" && git push)
